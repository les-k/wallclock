name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["20", "22", "24"]
        include:
          - os: windows-latest
            node: "22"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # ical.js is a dev dependency used by the tests; the app has none.
      - run: npm ci
      # Each Node version ships a different copy of the time-zone database, so
      # the tests assert only things that hold in every copy: fixed historical
      # dates, the 2026 US/UK/Australian rules, and properties that must hold
      # for every zone whatever its rules are.
      - run: npm test
      # The measurement itself, so a change that breaks the harness shows up
      # here. It does not assert on the numbers, which belong to one copy of the
      # time-zone data; the committed results say which.
      - run: node bench/run.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Publish only what the page needs.
      - run: |
          mkdir _site
          cp index.html app.js style.css _site/
          cp -r src _site/src
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
